# CASCADE — PRODUCTION overlay. Load explicitly (it is NOT auto-loaded):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Only Caddy is exposed to the internet; it terminates TLS and reverse-proxies
# to the internal services. In .env you MUST set: ENV=production, a strong
# ZITADEL_MASTERKEY (exactly 32 chars), APP_DOMAIN, ID_DOMAIN, and the OIDC_*
# values once the Zitadel application is created.
#
# Zitadel v3+ split its login screen out of the main binary into a separate
# Next.js app ("Login V2", ghcr.io/zitadel/zitadel-login). This overlay adds
# that service and wires it up per Zitadel's own reference compose
# (github.com/zitadel/zitadel — deploy/compose/docker-compose.yml):
#   - zitadel writes a one-time bootstrap PAT to a shared volume so
#     zitadel-login can call the API without a manually-issued secret.
#   - ZITADEL_VERSION must be pinned (not "latest") so the API and login
#     images stay on matching, tested versions.

services:
  web:
    # The only internet-facing ports. Caddy obtains Let's Encrypt certs on :443
    # (needs :80 for the ACME HTTP challenge and HTTP->HTTPS redirects).
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - zitadel
      - zitadel-login
      - glitchtip

  zitadel:
    # Root, like Zitadel's reference compose: setup must write the bootstrap
    # PAT into the shared volume, which is root-owned on first creation.
    # Without this, 03_default_instance fails with "permission denied" and
    # leaves the instance half-initialized.
    user: "0"
    # Behind Caddy's TLS: Zitadel must know its public identity is HTTPS on 443.
    environment:
      ZITADEL_EXTERNALDOMAIN: ${ID_DOMAIN}
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: "true"
      # --- First-instance bootstrap (applied ONLY the first time start-from-init
      # creates the instance; re-running against an already-initialized `zitadel`
      # DB is a no-op for these — a fresh DB is required to pick them up) -------
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-admin}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_ADMIN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      # The "login client" is a machine user Zitadel's own login UI uses to call
      # the API. Bootstrapping it here means no secret is ever typed by hand.
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: "Automatically Initialized IAM_LOGIN_CLIENT"
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${ZITADEL_LOGIN_CLIENT_PAT_EXPIRATION:-2030-01-01T00:00:00Z}
      # --- Ongoing instance config: send all login/logout traffic to Login V2 --
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${ID_DOMAIN}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${ID_DOMAIN}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${ID_DOMAIN}/ui/v2/login/logout?post_logout_redirect=
    # No healthcheck: `/app/zitadel ready` hardcodes an HTTPS check against
    # localhost:8080 regardless of ExternalSecure/TLS config (upstream bug,
    # unresolved — github.com/zitadel/zitadel issues #9495, #8106). Since we
    # deliberately serve plain HTTP internally (Caddy terminates TLS), that
    # check always fails even though the server is fine — it left this
    # container permanently "unhealthy" and blocked zitadel-login/web from
    # starting on every restart. The image also has no shell/curl/wget to
    # build a working substitute (distroless-style base). Removed rather
    # than report a false-negative status; zitadel-login below depends on
    # "started", not "healthy", accordingly.
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw

  # Login V2 — the UI Zitadel now requires as a separate process (see the
  # overlay-level comment above). Not in the base file/dev override: local dev
  # keeps the classic embedded login for simplicity; only prod needs this.
  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:${ZITADEL_VERSION}
    # Root (reference compose does the same): must read the root-owned PAT
    # from the shared bootstrap volume.
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: "Host:${ID_DOMAIN},X-Forwarded-Proto:https"
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel:
        condition: service_started
    restart: unless-stopped

volumes:
  zitadel-bootstrap:
