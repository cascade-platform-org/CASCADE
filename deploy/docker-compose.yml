# CASCADE — base Compose stack (service definitions, no host ports).
#
# Host port publishing lives in the overlay files so the same base works for
# both environments:
#   * dev  — docker-compose.override.yml is auto-loaded by `docker compose`
#            (publishes localhost-only ports for poking at services)
#   * prod — docker-compose.prod.yml, loaded explicitly:
#            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Services share a private network and reach each other by service name
# (backend -> db:5432, caddy -> backend:8000 / zitadel:8080).
#
# First run:  cd deploy && cp .env.example .env  (then edit .env)

name: cascade

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed by db-init/01-create-zitadel-db.sh (first boot only) to create
      # Zitadel's dedicated least-privilege runtime role.
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: CASCADE-backend/Dockerfile
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      # Optional: enables the "Continue with Google" shortcut. Unset => no
      # button, and the app never contacts Google.
      OIDC_GOOGLE_IDP_ID: ${OIDC_GOOGLE_IDP_ID:-}
      # Optional: lets account deletion erase the user in Zitadel too (full GDPR
      # erasure). Without it, deletion removes only the app record.
      ZITADEL_MGMT_URL: ${ZITADEL_MGMT_URL:-}
      ZITADEL_MGMT_TOKEN: ${ZITADEL_MGMT_TOKEN:-}
      # Error tracking + performance traces (Sentry / self-hosted GlitchTip).
      # Unset SENTRY_DSN => sentry_sdk.init() is never called (main.py), nothing
      # leaves the box. SENTRY_TRACES_SAMPLE_RATE is read regardless but has no
      # effect without a DSN.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
    depends_on:
      db:
        condition: service_healthy
    # Exactly one replica — the in-process rate-limiter (ADR-0008) demands it.
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        # Baked into the static export at build time, so it belongs here and
        # not under `environment` — a NEXT_PUBLIC_* value set on the running
        # container arrives long after the HTML was generated. Empty locally.
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-}
        # Browser-side error/performance reporting (self-hosted GlitchTip).
        # Unset => Sentry.init() is never called (lib/observability.ts), so
        # local/dev builds report nothing.
        NEXT_PUBLIC_SENTRY_DSN: ${GLITCHTIP_FRONTEND_DSN:-}
    environment:
      # Real hostnames in production (app.<domain> / id.<domain>) => automatic
      # HTTPS. Defaults are local HTTP ports for testing without a domain.
      APP_DOMAIN: ${APP_DOMAIN:-:80}
      ID_DOMAIN: ${ID_DOMAIN:-:8081}
      # Optional: the domain the whole app used to be served from before the
      # public website took the apex (see Caddyfile). Unset locally defaults to
      # an unpublished port, so the redirect site block is inert in dev.
      LEGACY_APP_DOMAIN: ${LEGACY_APP_DOMAIN:-:8082}
      # Optional: Caddy vhost for GlitchTip (self-hosted error/performance
      # tracking). Unset locally defaults to an unpublished port — dev reaches
      # GlitchTip directly instead (docker-compose.override.yml), same pattern
      # as zitadel's dev port.
      ERRORS_DOMAIN: ${ERRORS_DOMAIN:-:8083}
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      # Persist issued TLS certificates + Caddy state across restarts.
      - caddy-data:/data
      - caddy-config:/config

  zitadel:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-latest}
    # start-from-init: create the schema on first run, then start. Idempotent on
    # later runs. tlsMode external: Caddy terminates TLS; Zitadel serves HTTP.
    command:
      - start-from-init
      - --masterkey
      - ${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}
      - --tlsMode
      - external
    environment:
      # Database — Zitadel uses its own `zitadel` DB in the shared Postgres.
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      # Runtime queries use a dedicated role confined to the `zitadel` DB —
      # never the superuser (least privilege; the ADMIN_* creds below are used
      # only by start-from-init to create Zitadel's schemas).
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel_user
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # How Zitadel builds issuer/redirect URLs. Overridden for prod (id.<domain>,
      # port 443, secure) in docker-compose.prod.yml.
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNALDOMAIN:-localhost}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT:-8081}
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Self-hosted error tracking + performance traces (Sentry-protocol-compatible;
  # CASCADE-backend/main.py and CASCADE-app/lib/observability.ts already speak
  # it — this is only "on" once SENTRY_DSN / NEXT_PUBLIC_SENTRY_DSN are set to
  # a project DSN created in GlitchTip's own console after first boot, see
  # docs/project/deployment.md). `all_in_one` runs GlitchTip's web + worker +
  # scheduler in one process — the image's own recommended shape for a single
  # small VM (256-512 MB RAM). Uses the shared Postgres via its own
  # least-privilege role (deploy/db-init/02-create-glitchtip-db.sh), not a
  # dedicated database container, so it costs one more service, not two.
  glitchtip:
    image: glitchtip/glitchtip:6
    environment:
      DATABASE_URL: postgresql://glitchtip_user:${GLITCHTIP_DB_PASSWORD}@db:5432/glitchtip
      VALKEY_URL: redis://valkey:6379
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-to-a-random-string}
      # consolemail:// prints outbound mail to the container log instead of
      # sending it — the operator is the only user (self-registration is off
      # below), so no SMTP is required to stand this up. Set GLITCHTIP_EMAIL_URL
      # once you have SMTP credentials if you want real alert emails.
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL:-errors@example.org}
      GLITCHTIP_DOMAIN: https://${ERRORS_DOMAIN:-localhost:8090}
      SERVER_ROLE: all_in_one
      # Single-operator instance: nobody should be able to self-register an
      # account on your error dashboard. The first user is created by hand
      # (docs/project/deployment.md), same shape as CASCADE's own create_admin.py.
      ENABLE_OPEN_USER_REGISTRATION: "False"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    restart: unless-stopped
    volumes:
      - glitchtip-uploads:/code/uploads

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
  glitchtip-uploads:
