name: CI

# Runs on direct pushes to main and on every pull request. A red check here
# means the change is not safe to merge.
on:
  push:
    branches: [main]
  pull_request:

# Only keep the latest run per branch/PR; cancel superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CASCADE-backend
    # A throwaway Postgres so the DB-integration tests run for real (they are
    # skipped when TEST_DATABASE_URL is unset).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CASCADE-backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Types (pyright)
        run: pyright

      - name: Security lint (bandit)
        run: bandit -c pyproject.toml -r .

      # PYSEC-2026-1325 (ecdsa) has no fix version — it is ecdsa's documented
      # lack of side-channel resistance, reachable only for ES* JWT algorithms,
      # and this service signs RS256. Rationale in full in scripts/audit.sh.
      - name: Known CVEs (pip-audit)
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: Dead code (vulture)
        run: vulture . --config pyproject.toml

      - name: Dependencies (deptry)
        run: deptry .

      # The CLAUDE.md §7 engine boundary, mechanically enforced. ADR-0009's
      # future extraction of engine/ into a private submodule is a one-step
      # operation only while nothing outside propagation_service imports it —
      # which is a property that has to be checked on every change, not
      # remembered.
      - name: Engine isolation (import-linter, ADR-0009)
        run: lint-imports --config pyproject.toml

      - name: Tests (pytest, incl. DB integration)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -q

      # Schema-first guard (CLAUDE.md §6): the JSON Schema bridge files must be
      # regenerated whenever a Pydantic model changes. A diff here means someone
      # changed schemas/*.py without running the export script.
      - name: Schema drift (Pydantic → JSON Schema bridge)
        run: |
          python scripts/export_json_schema.py
          git diff --exit-code -- ../CASCADE-app/shared/schemas/

  frontend:
    name: Frontend — type-check + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CASCADE-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: CASCADE-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        run: npx --no-install tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

      - name: Dead code (knip)
        run: npm run audit:deadcode

      - name: Circular imports (madge)
        run: npm run audit:circular

      - name: Build (static export)
        run: npm run build

  secrets:
    name: Secrets — baseline scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      # Scans EVERY tracked file, never a subset: detect-secrets rewrites the
      # baseline from what it was given, so scanning part of the tree silently
      # drops the audited verdicts for everything else.
      #
      # Only `results` is compared. The baseline also carries a `generated_at`
      # timestamp that changes on every run, so diffing the whole file would
      # fail on every PR regardless of findings.
      - name: No new secrets
        run: |
          git ls-files | xargs detect-secrets scan --baseline .secrets.baseline
          python .github/scripts/check_secrets_baseline.py

  docs:
    name: Docs — integrity + links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A stringified object in a doc means some tool/template interpolation
      # wrote garbage into it (this actually happened to rbac-setup.md).
      - name: No corrupted interpolations
        run: |
          if grep -rn --include="*.md" -F "[object Object]" .; then
            echo "::error::Corrupted interpolation found in docs (see matches above)."
            exit 1
          fi

      # Offline mode: checks only file-to-file links (deterministic — external
      # URLs are skipped so a flaky website can never fail CI).
      - name: Internal links resolve (lychee, offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "$PWD" "**/*.md"
          fail: true

  docker:
    name: Docker images + compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guard the deploy path: the compose files must parse and the images must
      # build from the repo root (this is what caught the shared-grammar bug).
      - name: Validate compose (dev + prod)
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          ID_DOMAIN=id.example.org APP_DOMAIN=app.example.org \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null

      - name: Build backend image
        run: docker build -f CASCADE-backend/Dockerfile -t cascade-backend:ci .

      - name: Build web image
        run: docker build -f deploy/web.Dockerfile -t cascade-web:ci .
